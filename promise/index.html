<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f2f2;
        }

        .container{
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            width:320px;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #message{
            text-align:center;
            margin-top:15px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login Form</h2>

    <input type="email" id="email" placeholder="Enter Email" required>

    <input type="password" id="password" placeholder="Enter Password" required>

    <button onclick="login()">Login</button>

    <p id="message"></p>
</div>

<script>
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let message = document.getElementById("message");

    if(email == "kuldeepkumar1623@gmail.com" && password == "1623"){
        message.innerHTML = "Login Successful!";
        message.style.color = "green";
    } else {
        message.innerHTML = "Please enter Email and Password.";
        message.style.color = "red";
    }
}
</script>

</body>
</html>
